name: Android CI Ultra-Final-Debug

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release
        id: build
        run: |
          echo "🚀 Building APK..."
          ./gradlew assembleRelease --stacktrace --warning-mode=none 2>&1 | tee /tmp/build.log
          echo "BUILD_STATUS=$?" >> $GITHUB_ENV
          echo "::notice::Build status = $?"

      - name: Show APK directory content
        run: |
          echo "::group::📁 APK directory content"
          ls -la app/build/outputs/apk/release/ || echo "Directory not found"
          echo "::endgroup::"

      - name: Show Compilation Errors
        run: |
          echo "::group::🔴 Compilation Errors"
          grep -E "^e: |error:|FAILED|Exception|Unresolved reference|cannot find symbol|not found|could not resolve|> A failure occurred" /tmp/build.log || echo "✅ No critical errors found"
          echo "::endgroup::"

      - name: Upload Full Log
        uses: actions/upload-artifact@v4
        with:
          name: full-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30
