name: Android CI Ultra-Final-Debug

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release (Direct output + filtered + tail)
        run: |
          echo "🚀 Running Gradle build (direct output)..."
          ./gradlew assembleRelease --stacktrace --warning-mode=none | tee full_log.txt

          echo "❌ Filtered errors:"
          echo "----------------------------------------"

          grep -i "error" full_log.txt || true
          grep -i "FAILED" full_log.txt || true
          grep -i "Exception" full_log.txt || true
          grep -i "Unresolved reference" full_log.txt || true
          grep -i "cannot find symbol" full_log.txt || true
          grep -i "not found" full_log.txt || true
          grep -i "could not resolve" full_log.txt || true
          grep -i "> A failure occurred" full_log.txt || true

          echo "----------------------------------------"
          echo "🔍 Last 200 lines:"
          tail -n 200 full_log.txt

      - name: Upload full log artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-log
          path: full_log.txt
