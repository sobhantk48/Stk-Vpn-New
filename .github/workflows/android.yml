name: Android CI Ultra-Pro

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release (Ultra-Pro filtered output)
        run: |
          echo "🚀 Running Gradle build..."
          ./gradlew assembleRelease --stacktrace --warning-mode=none > full_log.txt 2>&1

          echo "❌ Showing only filtered errors:"
          echo "----------------------------------------"

          # Kotlin errors
          grep -i "e: " full_log.txt || true

          # General Gradle errors
          grep -i "error" full_log.txt || true

          # Task failures
          grep -i "FAILED" full_log.txt || true
          grep -i "Execution failed" full_log.txt || true
          grep -i "Build failed" full_log.txt || true

          # Exceptions
          grep -i "Exception" full_log.txt || true
          grep -i "Caused by" full_log.txt || true

          # Native / AAR / Transform errors
          grep -i "Transform" full_log.txt || true
          grep -i ".aar" full_log.txt || true
          grep -i ".so" full_log.txt || true

          # Manifest / Resource errors
          grep -i "manifest" full_log.txt || true
          grep -i "resource" full_log.txt || true
          grep -i "xml" full_log.txt || true

          # Compose compiler errors
          grep -i "compose" full_log.txt || true

          # Hilt errors
          grep -i "hilt" full_log.txt || true

          # Serialization errors
          grep -i "serialization" full_log.txt || true

          # CameraX / MLKit errors
          grep -i "camera" full_log.txt || true
          grep -i "mlkit" full_log.txt || true

          echo "----------------------------------------"
          echo "📄 Full log saved as full_log.txt"

      - name: Upload full log artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-log
          path: full_log.txt
