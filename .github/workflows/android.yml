name: Android CI Ultra-Final-Debug

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release (full log on error)
        run: |
          echo "🚀 Running Gradle build..."
          # اجرای بیلد و ذخیره کامل خروجی در فایل موقت
          ./gradlew assembleRelease --stacktrace --warning-mode=none 2>&1 | tee /tmp/build.log

          echo "::group::🔴 Compilation Errors (filtered)"
          grep -E "e: |error:|FAILED|Exception|Unresolved reference|cannot find symbol|not found|could not resolve|> A failure occurred" /tmp/build.log || echo "✅ No critical errors found in filtered search"
          echo "::endgroup::"

          # اگر خطایی وجود داشت، کل لاگ رو چاپ کن
          if grep -q -E "e: |FAILED|BUILD FAILED" /tmp/build.log; then
            echo "::error::Build failed - printing full log below:"
            echo "==================== FULL LOG START ===================="
            cat /tmp/build.log
            echo "==================== FULL LOG END ===================="
            exit 1
          else
            echo "✅ Build successful - no critical errors"
          fi

      - name: Upload full log artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: full-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7
