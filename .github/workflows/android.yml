name: Android CI Ultra-Final-Debug

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build Release
        id: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "🚀 Building signed APK..."
          ./gradlew assembleRelease --stacktrace --warning-mode=none 2>&1 | tee /tmp/build.log
          echo "BUILD_STATUS=$?" >> $GITHUB_ENV

      - name: Show Compilation Errors
        run: |
          echo "::group::🔴 Compilation Errors"
          grep -E "^e: |error:|FAILED|Exception|Unresolved reference|cannot find symbol|not found|could not resolve|> A failure occurred" /tmp/build.log || echo "✅ No critical errors found"
          echo "::endgroup::"

      - name: Upload Full Log (always)
        uses: actions/upload-artifact@v4
        with:
          name: full-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Signed APK
        if: env.BUILD_STATUS == '0'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30
