name: Build libbox (stable v1.11.0)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: 1

    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget unzip build-essential pkg-config

      - name: Download Android NDK r26d
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          mkdir -p "$HOME/android-sdk"
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Verify NDK
        run: |
          echo "$ANDROID_NDK_HOME"
          ls -la "$ANDROID_NDK_HOME"

      - name: Clone sing-box (v1.11.0 - without naive/cronet)
        run: |
          git clone --branch v1.11.0 --depth=1 https://github.com/SagerNet/sing-box.git sing-box

      - name: Install gomobile
        run: |
          echo "$HOME/go/bin" >> $GITHUB_PATH
          export PATH=$PATH:$HOME/go/bin
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          gomobile init

      - name: Build libbox
        run: |
          export PATH=$PATH:$HOME/go/bin
          cd sing-box
          go run ./cmd/internal/build_libbox \
            -target android \
            -platform android/arm64

      - name: Upload libbox
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box/libbox.aar
          if-no-files-found: error
          retention-days: 30
