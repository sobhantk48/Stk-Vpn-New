name: Build libbox Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: 1

    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            wget \
            build-essential \
            pkg-config

      - name: Install Android SDK commandline tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O cmdline-tools.zip

          unzip -q cmdline-tools.zip

          mv cmdline-tools \
             $HOME/android-sdk/cmdline-tools/latest

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Android NDK r26d
        run: |
          wget -q \
            https://dl.google.com/android/repository/android-ndk-r26d-linux.zip

          unzip -q android-ndk-r26d-linux.zip

          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r26d" \
            >> $GITHUB_ENV

      - name: Verify Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          ls -la "$ANDROID_NDK_HOME"

          "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
            --version

      - name: Clone sing-box
        run: |
          git clone \
            --depth=1 \
            https://github.com/SagerNet/sing-box.git \
            sing-box

      - name: Disable Cronet support
        run: |
          cd sing-box

          find . -type f \
            \( -name "*.go" -o -name "*.mod" \) \
            -exec sed -i \
            's/with_naive_outbound//g' {} \; || true

      - name: Install gomobile
        run: |
          echo "$HOME/go/bin" >> $GITHUB_PATH
          export PATH=$PATH:$HOME/go/bin

          go install \
            github.com/sagernet/gomobile/cmd/gomobile@v0.1.12

          gomobile init

          gomobile version || true

      - name: Show Go environment
        run: |
          export PATH=$PATH:$HOME/go/bin

          go version
          go env

      - name: Build libbox
        run: |
          export PATH=$PATH:$HOME/go/bin

          cd sing-box

          go run ./cmd/internal/build_libbox \
            -target android \
            -platform android/arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: |
            sing-box/libbox.aar
            sing-box/**/*.aar
          if-no-files-found: warn
          retention-days: 30
