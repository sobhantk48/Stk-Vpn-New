name: Build libbox (Cronet Disabled)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: 1

    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget unzip build-essential pkg-config

      - name: Download Android NDK r26d
        run: |
          wget -q \
            https://dl.google.com/android/repository/android-ndk-r26d-linux.zip

          unzip -q android-ndk-r26d-linux.zip

          # ✅ پیدا کردن نام واقعی پوشه استخراج شده
          NDK_DIR=$(find . -maxdepth 1 -type d -name "android-ndk-r26*" | head -1)
          echo "NDK directory: $NDK_DIR"

          # ✅ تنظیم ANDROID_NDK_HOME با نام واقعی
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV

          # ✅ نمایش محتویات برای تأیید
          ls -la "$NDK_DIR"

      - name: Verify NDK
        run: |
          echo "NDK Path: $ANDROID_NDK_HOME"
          ls -la "$ANDROID_NDK_HOME"
          "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version

      - name: Clone sing-box
        run: |
          git clone \
            --depth=1 \
            https://github.com/SagerNet/sing-box.git

      - name: Install gomobile
        run: |
          echo "$HOME/go/bin" >> $GITHUB_PATH
          export PATH=$PATH:$HOME/go/bin

          go install \
            github.com/sagernet/gomobile/cmd/gomobile@v0.1.12

          gomobile init

      - name: Disable Cronet
        run: |
          cd sing-box

          go mod edit \
            -droprequire github.com/sagernet/cronet-go || true

          find . \
            -type f \
            -name "*.go" \
            -exec sed -i '/cronet-go/d' {} \;

          go clean -cache
          go clean -modcache
          go mod tidy

      - name: Show environment
        run: |
          export PATH=$PATH:$HOME/go/bin

          go version
          go env

          which gomobile
          gomobile version || true

      - name: Build libbox
        run: |
          export PATH=$PATH:$HOME/go/bin

          cd sing-box

          go run ./cmd/internal/build_libbox \
            -target android \
            -platform android/arm64

      - name: Upload libbox
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box/libbox.aar
          if-no-files-found: error
          retention-days: 30
