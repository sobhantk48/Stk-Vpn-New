name: Build sing-box libbox

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-libbox:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sing-box source
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          path: sing-box
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget build-essential pkg-config

      - name: Download Android NDK r27c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r27c" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          gomobile init

      - name: Build libbox for Android ARM64
        run: |
          cd sing-box
          go run ./cmd/internal/build_libbox \
            -target android \
            -platform android/arm64 \
            -tags with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api

      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box/libbox.aar
          if-no-files-found: error
          retention-days: 30
