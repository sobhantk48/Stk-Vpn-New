plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.24'
}

android {
    namespace 'com.v2ray.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.v2ray.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters += ["arm64-v8a", "armeabi-v7a"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }

    packagingOptions {
        pickFirst "lib/**/libgojni.so"
        pickFirst "lib/**/libv2ray.so"
        pickFirst "lib/**/libsingbox.so"
    }
}

dependencies {
    // Core
    implementation "androidx.core:core-ktx:1.13.1"

    // Compose BOM
    implementation platform("androidx.compose:compose-bom:2024.06.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // Material Icons Extended (برای RadioButtonUnchecked)
    implementation "androidx.compose.material:material-icons-extended:1.6.8"

    // Lifecycle + Activity Compose
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
    implementation "androidx.activity:activity-compose:1.9.0"

    // Compose Saveable (برای rememberSaveable)
    implementation "androidx.compose.runtime:runtime-saveable:1.6.8"

    // Navigation Compose + Hilt Navigation
    implementation "androidx.navigation:navigation-compose:2.7.7"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"

    // Hilt
    implementation "com.google.dagger:hilt-android:2.51.1"
    kapt "com.google.dagger:hilt-compiler:2.51.1"

    // Kotlin Serialization
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Gson
    implementation "com.google.code.gson:gson:2.10.1"

    // CameraX (برای QrScanner.kt)
    implementation "androidx.camera:camera-core:1.3.3"
    implementation "androidx.camera:camera-camera2:1.3.3"
    implementation "androidx.camera:camera-lifecycle:1.3.3"
    implementation "androidx.camera:camera-view:1.3.3"

    // ML Kit Barcode Scanning
    implementation "com.google.mlkit:barcode-scanning:17.2.0"

    // Native V2Ray / SingBox (کتابخانه‌های بومی)
    implementation files("libs/libv2ray.aar")
    implementation files("libs/libsingbox.aar")
}

kapt {
    correctErrorTypes = true
}
